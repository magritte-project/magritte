[project]
name = "magritte"
version = "0.1.0"
description = "The API server of Magritte"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.4",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.140.9",
    "greenlet>=3.5.4",
    "httpx2>=2.10.0",
    "pathvalidate>=3.3.1",
    "pillow>=12.0.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.11.9",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "sqlmodel>=0.0.25",
    "tinytag>=2.3.0",
    "watchdog>=6.0.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
desktop = [
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.71.0",
    "faker>=40.36.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["magritte/**", "admin", "admin.bat"]
force-include = { "web/dist" = "static" }
exclude = ["test*", "conftest.py", "*.pyc", "magritte/testseed.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"


[tool.alembic]
script_location = "%(here)s/magritte/migrations"
prepend_sys_path = [
    "."
]
[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
