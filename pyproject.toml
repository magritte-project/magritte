[project]
name = "magritte-project"
version = "0.2.1"
description = "A personal music platform"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "greenlet>=3.5.6",
    "httptools>=0.9.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "pathvalidate>=3.3.1",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.48",
    "tinytag>=2.3.2",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "watchdog>=7.1.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://magritte-project.github.io/"
Repository = "https://github.com/magritte-project/magritte"

[project.scripts]
magritte = "magritte.__main__:main"

[project.optional-dependencies]
desktop = [
    "keyring>=25.7.0",
]
mailtrap = [
    "mailtrap>=3.0.0"
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.90.0",
    "faker>=40.44.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "semver>=3.1.0",
    "tomlkit>=0.15.2",
    "ty>=0.0.98,!=0.0.99",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["magritte/**", "admin", "admin.bat"]
force-include = { "web/dist" = "magritte/static" }
exclude = ["test*", "conftest.py", "*.pyc", "magritte/testseed.py"]

[tool.hatch.build.targets.wheel]
packages = ["magritte"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
# Dump every thread's stack if a test hangs, rather than stalling silently in CI
faulthandler_timeout = 60

[tool.alembic]
script_location = "%(here)s/magritte/migrations"
prepend_sys_path = [
    "."
]
[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
