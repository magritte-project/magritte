name: Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        name: Magritte
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install just
              uses: extractions/setup-just@v3
            - name: Setup asdf
              uses: asdf-vm/actions/setup@v4
            - name: Cache asdf
              id: asdf-tools-cache
              uses: actions/cache@v4
              with:
                  path: |
                      /home/runner/.asdf
                  key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}
                  restore-keys: |
                      ${{ runner.os }}-asdf-
            - name: Install dependencies in .tool-versions
              if: ${{ steps.asdf-tools-cache.outputs.cache-hit != 'true' }}
              uses: asdf-vm/actions/install@v4
            - name: Bootstrap
              run: ./bootstrap
            - name: Seed .env
              run: |
                  ENV=ci
                  sed -i.bak "s#^\(ENV=\).*#\1${ENV//#/\\#}#" .env && rm .env.bak
            - name: Lint
              run: just lint
            - name: Format
              run: just format
            - name: Export OpenAPI
              run: just generate-openapi
            - name: Verify Openapi Up To Date
              run: |
                  if [[ -n $(git status --porcelain) ]]; then
                    echo "::error::Branch is not clean. Check that it is linted, formatted, and has an up to date openapi.d.ts file"
                    git status
                    git diff
                    exit 1
                  fi
            - name: Check Types
              run: just check-types
            - name: Test
              run: just test
