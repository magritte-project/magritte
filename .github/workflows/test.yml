name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Magritte
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v4
      - name: Bootstrap
        run: just bootstrap
      - name: Lint
        run: just lint
      - name: Format
        run: just format
      - name: Verify Already Linted And Formatted
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Branch is not fully linted and formatted"
            git status
            git diff
            exit 1
          fi
      - name: Export OpenAPI
        run: just export-openapi
      - name: Verify Openapi Up To Date
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::openapi.d.ts is out of date"
            git status
            git diff
            exit 1
          fi
      - name: Check Types
        run: just check-types
      - name: Test
        run: just test
      